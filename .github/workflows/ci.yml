name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # setup-envtest needs a newer Go than go.mod asks for. Go downloads it on demand.
  GOTOOLCHAIN: auto

jobs:
  test:
    name: Unit and envtest suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  generated:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make verify-generated

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make helm-lint

  e2e:
    name: Kind end to end (GPU preemption and rollout)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: kube-op-lite
      - name: Build the operator image and load it into Kind
        run: |
          docker build -t kube-op-lite:ci .
          kind load docker-image kube-op-lite:ci --name kube-op-lite
      - name: Install the operator with fake GPUs
        run: |
          make kind-gpus
          helm upgrade --install kube-op-lite charts/kube-op-lite \
            --namespace kube-op-lite-system --create-namespace \
            --set image.repository=kube-op-lite --set image.tag=ci \
            --wait --timeout 3m
      - name: Preemption demo
        run: make preemption-demo
      - name: Rollout test
        run: make rollout-test
      - name: Operator logs
        if: failure()
        run: kubectl -n kube-op-lite-system logs deploy/kube-op-lite-controller-manager --tail=200
