---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-gpu-kube-op-lite-io-v1alpha1-gpuworkload
  failurePolicy: Fail
  name: mgpuworkload.kb.io
  rules:
  - apiGroups:
    - gpu.kube-op-lite.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - gpuworkloads
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-gpu-kube-op-lite-io-v1alpha1-gpuworkload
  failurePolicy: Fail
  name: vgpuworkload.kb.io
  rules:
  - apiGroups:
    - gpu.kube-op-lite.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - gpuworkloads
  sideEffects: None
